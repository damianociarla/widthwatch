<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WidthWatch checkout fixture</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5ef;color:#10130f;font-family:Arial,sans-serif}.bar{height:58px;background:#10130f;color:#c8ff3d;display:flex;align-items:center;padding:0 5vw;font-weight:800}.checkout{width:min(920px,90vw);margin:70px auto;display:grid;grid-template-columns:1fr 280px;gap:6vw}.eyebrow{font:12px monospace;text-transform:uppercase;color:#66705f}.checkout h1{font-size:clamp(42px,7vw,76px);line-height:.92;letter-spacing:-.06em;margin:20px 0 28px}.checkout p{color:#646b60;line-height:1.6}.summary{border-left:1px solid #b8bdb3;padding-left:28px}.line{display:flex;justify-content:space-between;border-bottom:1px solid #ccd0c8;padding:14px 0}.checkout-actions{margin-top:34px}.primary{border:0;background:#10130f;color:#fff;padding:16px 24px;white-space:nowrap;font-weight:700}@media(max-width:680px){.checkout{grid-template-columns:1fr}.summary{border-left:0;border-top:1px solid #b8bdb3;padding:24px 0 0}}
