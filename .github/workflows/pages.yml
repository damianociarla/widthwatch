name: Deploy website
on:
  workflow_call:
    inputs:
      release_tag: { required: true, type: string }
  workflow_dispatch:
    inputs:
      release_tag:
        description: Latest stable GitHub Release to redeploy
        required: true
        type: string
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
env:
  RELEASE_TAG: ${{ inputs.release_tag }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages recovery dispatch source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          [[ "$DISPATCH_REF" == "refs/heads/main" ]] || {
            echo "Pages recovery must be dispatched from main." >&2
            exit 1
          }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ env.RELEASE_TAG }}", fetch-depth: 0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: npm }
      - name: Verify published release source
        shell: bash
        run: |
          release_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          GITHUB_REF_TYPE=tag GITHUB_REF="refs/tags/$RELEASE_TAG" \
            ./infra/github/validate-release-ref.sh "$RELEASE_TAG" "$release_sha"
          node ./infra/github/validate-latest-release-tag.mjs "$RELEASE_TAG"
          release_state="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '"\(.isDraft):\(.isPrerelease)"')"
          [[ "$release_state" == "false:false" ]] || {
            echo "Pages may deploy only an existing non-draft, non-prerelease GitHub Release." >&2
            exit 1
          }
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: npm ci
      - run: npm run build --workspace @widthwatch/web
        env: { VITE_API_URL: "${{ vars.VITE_API_URL }}" }
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with: { path: apps/web/dist }
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
