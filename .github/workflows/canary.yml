name: Public scanner canary
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
permissions: {}
concurrency: { group: widthwatch-public-canary, cancel-in-progress: false }
jobs:
  canary:
    runs-on: ubuntu-latest
    environment: monitoring
    timeout-minutes: 4
    permissions: { id-token: write, issues: write }
    steps:
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_CANARY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Verify health, scan, status and report policy
        shell: bash
        env:
          API_URL: https://d35vhnded4ly3z.cloudfront.net
        run: |
          set -euo pipefail
          test "$(curl --retry 3 --max-time 15 --silent --output /dev/null --write-out '%{http_code}' "$API_URL/health")" = 200
          enabled="$(aws cloudformation describe-stacks --region us-east-1 --stack-name widthwatch-scanner-switch --query "Stacks[0].Parameters[?ParameterKey=='PublicScannerEnabled'].ParameterValue|[0]" --output text)"
          if [[ "$enabled" == "false" ]]; then
            response_directory="$(mktemp -d)"
            headers="$response_directory/headers"
            normalized_headers="$response_directory/headers.normalized"
            body="$response_directory/body"
            trap 'rm -r "$response_directory"' EXIT
            test "$(curl --max-time 15 --silent --dump-header "$headers" --output "$body" --write-out '%{http_code}' --header 'Origin: https://damianociarla.github.io' --header 'content-type: application/json' --data '{"url":123}' "$API_URL/v1/scans")" = 403
            tr -d '\r' <"$headers" >"$normalized_headers"
            grep -Eiq '^content-type:[[:space:]]*application/json' "$normalized_headers"
            grep -Fxiq 'access-control-allow-origin: https://damianociarla.github.io' "$normalized_headers"
            grep -Fxiq 'cache-control: no-store' "$normalized_headers"
            jq -e '.error == "scanner_paused"' "$body" >/dev/null
            exit 0
          fi
          test "$enabled" = true
          response="$(curl --retry 2 --max-time 70 --silent --show-error --header 'content-type: application/json' --data '{"url":"https://damianociarla.github.io/widthwatch/"}' "$API_URL/v1/scans")"
          status="$(jq -r .status <<<"$response")"
          id="$(jq -r .id <<<"$response")"
          for _ in {1..15}; do
            [[ "$status" == "complete" || "$status" == "failed" ]] && break
            sleep 2
            response="$(curl --retry 2 --max-time 15 --silent --show-error "$API_URL/v1/scans/$id")"
            status="$(jq -r .status <<<"$response")"
          done
          test "$status" = complete
          report_directory="$(mktemp -d)"
          report_headers="$report_directory/headers"
          normalized_report_headers="$report_directory/headers.normalized"
          trap 'rm -r "$report_directory"' EXIT
          report_status="$(curl --retry 2 --max-time 15 --silent --show-error --dump-header "$report_headers" --output /dev/null --write-out '%{http_code}' "$API_URL/v1/reports/$id")"
          test "$report_status" = 200
          tr -d '\r' <"$report_headers" >"$normalized_report_headers"
          grep -Fxiq 'content-type: text/html; charset=utf-8' "$normalized_report_headers"
          grep -Fxiq 'cache-control: private, no-store' "$normalized_report_headers"
          grep -Fxiq 'x-robots-tag: noindex, nofollow, noarchive' "$normalized_report_headers"
      - name: Open or update the operational canary incident
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Public scanner canary is failing"
          number="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          body="The hourly public scanner canary failed. No target URL or response content is included. Run: $RUN_URL"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Resolve the operational canary incident after recovery
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Public scanner canary is failing"
          number="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [[ -n "$number" ]]; then
            gh issue close "$number" --comment "The public scanner canary has recovered."
          fi
