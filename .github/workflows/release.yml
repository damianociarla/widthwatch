name: Release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to resume after an interrupted release
        required: true
        type: string
permissions: {}
concurrency: { group: widthwatch-release, cancel-in-progress: false }
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
jobs:
  release-ref:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ env.RELEASE_TAG }}", fetch-depth: 0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, package-manager-cache: false }
      - name: Verify immutable release ref
        run: |
          release_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          GITHUB_REF_TYPE=tag GITHUB_REF="refs/tags/$RELEASE_TAG" \
            ./infra/github/validate-release-ref.sh "$RELEASE_TAG" "$release_sha"
      - name: Reject historical release targets
        run: node ./infra/github/validate-latest-release-tag.mjs "$RELEASE_TAG"
      - name: Verify recovery dispatch source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          [[ "$DISPATCH_REF" == "refs/heads/main" ]] || {
            echo "Release recovery must be dispatched from main." >&2
            exit 1
          }
  validate:
    needs: release-ref
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ env.RELEASE_TAG }}" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pipx run cfn-lint infra/aws/*.yml
      - run: npm run typecheck && npm test && npm run build && npm run pack:check
  upgrade-scanner-switch:
    needs: [release-ref, validate]
    permissions: { contents: read, id-token: write }
    uses: ./.github/workflows/upgrade-scanner-switch.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  deploy-api:
    needs: [release-ref, validate, upgrade-scanner-switch]
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ env.RELEASE_TAG }}" }
      - uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: ./infra/aws/deploy.sh
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ECR_ACCESS_ROLE_ARN: ${{ vars.AWS_ECR_ACCESS_ROLE_ARN }}
          AWS_INSTANCE_ROLE_ARN: ${{ vars.AWS_INSTANCE_ROLE_ARN }}
          AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
          WIDTHWATCH_ORIGIN_VERIFY_TOKEN: ${{ secrets.WIDTHWATCH_ORIGIN_VERIFY_TOKEN }}
          WIDTHWATCH_BUDGET_ALERT_EMAIL: ${{ secrets.WIDTHWATCH_BUDGET_ALERT_EMAIL }}
          WIDTHWATCH_IMAGE_TAG: ${{ env.RELEASE_TAG }}
  publish-npm:
    needs: [release-ref, validate]
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ env.RELEASE_TAG }}" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          {
            node-version: 24,
            registry-url: "https://registry.npmjs.org",
            package-manager-cache: false,
          }
      - run: npm ci && npm run build --workspace widthwatch
      - name: Publish npm package when missing
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if npm view "widthwatch@$version" version >/dev/null 2>&1; then
            echo "widthwatch@$version is already published; continuing the idempotent release."
          else
            npm publish --workspace widthwatch
          fi
  github-release:
    needs: [release-ref, upgrade-scanner-switch, deploy-api, publish-npm]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ env.RELEASE_TAG }}" }
      - name: Create GitHub Release when missing
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already has a GitHub Release; continuing the idempotent release."
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "WidthWatch $RELEASE_TAG" --notes "Before upgrading, review the [versioned migration notes](https://github.com/${{ github.repository }}/blob/$RELEASE_TAG/docs/migrations.md)."
          fi
        env: { GH_TOKEN: "${{ github.token }}" }
  deploy-pages:
    needs: github-release
    permissions: { contents: read, pages: write, id-token: write }
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
