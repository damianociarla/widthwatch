name: Deploy API
on:
  workflow_dispatch:
permissions: {}
concurrency: { group: widthwatch-api-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: ./infra/aws/deploy.sh
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ECR_ACCESS_ROLE_ARN: ${{ vars.AWS_ECR_ACCESS_ROLE_ARN }}
          AWS_INSTANCE_ROLE_ARN: ${{ vars.AWS_INSTANCE_ROLE_ARN }}
          AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
          WIDTHWATCH_ORIGIN_VERIFY_TOKEN: ${{ secrets.WIDTHWATCH_ORIGIN_VERIFY_TOKEN }}
          WIDTHWATCH_BUDGET_ALERT_EMAIL: ${{ secrets.WIDTHWATCH_BUDGET_ALERT_EMAIL }}
          WIDTHWATCH_PUBLIC_SCANNER_ENABLED: ${{ vars.WIDTHWATCH_PUBLIC_SCANNER_ENABLED || 'true' }}
          WIDTHWATCH_IMAGE_TAG: ${{ github.sha }}
