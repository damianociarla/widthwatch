openapi: 3.1.0
info: { title: WidthWatch hosted scanner, version: 0.4.3 }
servers:
  - url: "https://d35vhnded4ly3z.cloudfront.net"
    description: Bounded public scanner through CloudFront and AWS WAF
paths:
  /health:
    get:
      operationId: health
      responses: { "200": { description: Healthy } }
  /v1/scans:
    post:
      operationId: createScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties: { url: { type: string, format: uri, maxLength: 2000 } }
      responses:
        "202": { description: Accepted; the connection may remain open briefly so App Runner keeps CPU allocated while the bounded scan runs }
        "400": { description: Invalid JSON, invalid URL shape, or unsafe public target }
        "413": { description: JSON body exceeds the 2048-byte admission limit }
        "429": { description: Client, target, or global quota reached }
        "503": { description: Hard capacity limit reached }
  /v1/scans/{id}:
    get:
      operationId: getScan
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Job status, optional lightweight timeline metadata without screenshots, and hosted report URL }
        "404": { description: Unknown or expired job }
  /v1/reports/{id}:
    get:
      operationId: getReport
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Interactive standalone HTML report
          content: { text/html: { schema: { type: string } } }
        "404": { description: Unknown, incomplete, or report older than the seven-day public retention window }
        "503": { description: Persistent report storage is temporarily unavailable }
