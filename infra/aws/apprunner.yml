AWSTemplateFormatVersion: "2010-09-09"
Description: Bounded WidthWatch App Runner API
Parameters:
  ImageIdentifier: { Type: String }
  EcrAccessRoleArn: { Type: String }
  InstanceRoleArn: { Type: String, Default: "" }
  OriginVerifyToken: { Type: String, NoEcho: true }
  AllowedOrigins: { Type: String, Default: "https://damianociarla.github.io" }
  BudgetAlertEmail: { Type: String, AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
  MonthlyBudgetUsd: { Type: Number, Default: 20 }
Conditions:
  HasReportPersistence: !Not [!Equals [!Ref InstanceRoleArn, ""]]
Resources:
  ReportBucket:
    Type: AWS::S3::Bucket
    Condition: HasReportPersistence
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "widthwatch-reports-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpirePublicDemoReports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 7
  Scaling:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: widthwatch-hard-cap
      MinSize: 1
      MaxSize: 1
      MaxConcurrency: 1
  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: widthwatch-api
      AutoScalingConfigurationArn: !GetAtt Scaling.AutoScalingConfigurationArn
      HealthCheckConfiguration: { Path: /health, Protocol: HTTP, Interval: 10, Timeout: 5, HealthyThreshold: 1, UnhealthyThreshold: 5 }
      InstanceConfiguration:
        Cpu: "1 vCPU"
        Memory: "2 GB"
        InstanceRoleArn: !If [HasReportPersistence, !Ref InstanceRoleArn, !Ref "AWS::NoValue"]
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration: { AccessRoleArn: !Ref EcrAccessRoleArn }
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - { Name: ORIGIN_VERIFY_TOKEN, Value: !Ref OriginVerifyToken }
              - { Name: ALLOWED_ORIGINS, Value: !Ref AllowedOrigins }
              - { Name: RATE_LIMIT_PER_10_MINUTES, Value: "2" }
              - { Name: TARGET_RATE_LIMIT_PER_HOUR, Value: "2" }
              - { Name: GLOBAL_RATE_LIMIT_PER_HOUR, Value: "30" }
              - !If
                - HasReportPersistence
                - { Name: REPORT_BUCKET, Value: !Ref ReportBucket }
                - !Ref "AWS::NoValue"
  OperationalAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: widthwatch-operational-alerts
  OperationalAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OperationalAlertTopic
      Protocol: email
      Endpoint: !Ref BudgetAlertEmail
  JobFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/apprunner/widthwatch-api/${Service.ServiceId}/application"
      FilterName: widthwatch-hosted-scan-failures
      FilterPattern: '{ $.event = "hosted_scan_failed" }'
      MetricTransformations:
        - MetricNamespace: WidthWatch/Hosted
          MetricName: FailedScans
          MetricValue: "1"
          DefaultValue: 0
  TransferFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/apprunner/widthwatch-api/${Service.ServiceId}/application"
      FilterName: widthwatch-transfer-limit-failures
      FilterPattern: '{ $.event = "hosted_scan_failed" && $.failureCode = "transfer_limit" }'
      MetricTransformations:
        - MetricNamespace: WidthWatch/Hosted
          MetricName: TransferLimitFailures
          MetricValue: "1"
          DefaultValue: 0
  FailedScansAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Three hosted scans failed within five minutes
      Namespace: WidthWatch/Hosted
      MetricName: FailedScans
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationalAlertTopic]
      OKActions: [!Ref OperationalAlertTopic]
  TransferLimitAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A hosted scan exhausted a transfer allowance
      Namespace: WidthWatch/Hosted
      MetricName: TransferLimitFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationalAlertTopic]
      OKActions: [!Ref OperationalAlertTopic]
  AppRunner5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: App Runner returned five or more 5xx responses in five minutes
      Namespace: AWS/AppRunner
      MetricName: 5xxStatusResponses
      Dimensions:
        - { Name: ServiceName, Value: widthwatch-api }
        - { Name: ServiceID, Value: !GetAtt Service.ServiceId }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationalAlertTopic]
      OKActions: [!Ref OperationalAlertTopic]
  AppRunnerCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: App Runner CPU stayed above 85 percent for ten minutes
      Namespace: AWS/AppRunner
      MetricName: CPUUtilization
      Dimensions:
        - { Name: ServiceName, Value: widthwatch-api }
        - { Name: ServiceID, Value: !GetAtt Service.ServiceId }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 85
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationalAlertTopic]
      OKActions: [!Ref OperationalAlertTopic]
  AppRunnerMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: App Runner memory stayed above 85 percent for ten minutes
      Namespace: AWS/AppRunner
      MetricName: MemoryUtilization
      Dimensions:
        - { Name: ServiceName, Value: widthwatch-api }
        - { Name: ServiceID, Value: !GetAtt Service.ServiceId }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 85
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationalAlertTopic]
      OKActions: [!Ref OperationalAlertTopic]
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: widthwatch-monthly-cost
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification: { ComparisonOperator: GREATER_THAN, NotificationType: FORECASTED, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ Address: !Ref BudgetAlertEmail, SubscriptionType: EMAIL }]
        - Notification: { ComparisonOperator: GREATER_THAN, NotificationType: ACTUAL, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ Address: !Ref BudgetAlertEmail, SubscriptionType: EMAIL }]
Outputs:
  ServiceUrl: { Value: !GetAtt Service.ServiceUrl }
  ServiceArn: { Value: !GetAtt Service.ServiceArn }
  OperationalAlertTopicArn: { Value: !Ref OperationalAlertTopic }
  OperationalAlertSubscriptionArn: { Value: !Ref OperationalAlertSubscription }
  OperationalAlarmsConfigured: { Value: "true" }
  BudgetAlertsConfigured: { Value: "true" }
  ReportBucketName:
    Condition: HasReportPersistence
    Value: !Ref ReportBucket
