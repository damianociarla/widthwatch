AWSTemplateFormatVersion: "2010-09-09"
Description: Versioned fail-closed WidthWatch public scanner control plane in us-east-1
Parameters:
  PublicScannerEnabled: { Type: String, Default: "false", AllowedValues: ["true", "false"] }
  ControlPlaneRevision: { Type: String, Default: bootstrap, AllowedPattern: "^(bootstrap|[a-f0-9]{64})$" }
Conditions:
  ScannerEnabled: !Equals [!Ref PublicScannerEnabled, "true"]
Resources:
  ScannerSwitchRuleGroup:
    Type: AWS::WAFv2::RuleGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: widthwatch-scanner-switch
      Description: Independent emergency admission switch, switch-only updates are owned by scanner-switch.yml
      Scope: CLOUDFRONT
      Capacity: 10
      CustomResponseBodies:
        ScannerPaused:
          ContentType: APPLICATION_JSON
          Content: '{"error":"scanner_paused","message":"The public scanner is temporarily paused."}'
      VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: widthwatch-scanner-switch, SampledRequestsEnabled: true }
      Rules:
        - Name: ScannerAdmission
          Priority: 0
          Action:
            !If
              - ScannerEnabled
              - { Count: {} }
              - Block:
                  CustomResponse:
                    ResponseCode: 403
                    CustomResponseBodyKey: ScannerPaused
                    ResponseHeaders:
                      - { Name: Access-Control-Allow-Origin, Value: "https://damianociarla.github.io" }
                      - { Name: Cache-Control, Value: "no-store" }
          Statement:
            AndStatement:
              Statements:
                - ByteMatchStatement:
                    FieldToMatch: { UriPath: {} }
                    PositionalConstraint: EXACTLY
                    SearchString: /v1/scans
                    TextTransformations: [{ Priority: 0, Type: NONE }]
                - ByteMatchStatement:
                    FieldToMatch: { Method: {} }
                    PositionalConstraint: EXACTLY
                    SearchString: POST
                    TextTransformations: [{ Priority: 0, Type: NONE }]
          VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: scanner-admission, SampledRequestsEnabled: true }
Outputs:
  RuleGroupArn: { Value: !GetAtt ScannerSwitchRuleGroup.Arn }
  RuleGroupId: { Value: !GetAtt ScannerSwitchRuleGroup.Id }
  RuleGroupName: { Value: widthwatch-scanner-switch }
  PublicScannerStatus: { Value: !If [ScannerEnabled, ENABLED, DISABLED] }
  ControlPlaneRevision: { Value: !Ref ControlPlaneRevision }
